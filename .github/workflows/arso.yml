name: ARSO Kranj screenshot in Excel

on:
  schedule:
    - cron: "52 23 * * *"
      timezone: "Europe/Ljubljana"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  zajem:
    runs-on: ubuntu-latest

    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4

      - name: Namesti Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Namesti Playwright in Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ustvari potrebne mape
        run: |
          mkdir -p screenshots
          mkdir -p tabela_vremena

      - name: Naredi screenshot
        run: python arso_screenshot.py

      - name: Preberi ARSO tabelo in posodobi Excel
        run: python arso_kranj.py

      - name: Shrani rezultate v repozitorij
        run: |
          git config user.name "ARSO Kranj Bot"
          git config user.email "actions@github.com"

          git add screenshots/
          git add tabela_vremena/ARSO_Kranj.xlsx
          git add arso_kranj.sqlite
          git add arso_kranj.log

          if git diff --cached --quiet; then
            echo "Ni novih sprememb."
            exit 0
          fi

          git commit -m "ARSO Kranj zajem $(TZ='Europe/Ljubljana' date +'%Y-%m-%d %H:%M Europe/Ljubljana')"
          git push
