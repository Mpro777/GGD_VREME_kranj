name: ARSO Kranj dnevni screenshot

on:
  schedule:
    # 22:55 UTC je pozimi 23:55 v Sloveniji.
    # Poleti bo zagon ob 00:55 po slovenskem času.
    - cron: "55 22 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4

      - name: Namesti Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Namesti Playwright in Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Naredi screenshot
        run: python arso_screenshot.py

      - name: Shrani screenshot v repozitorij
        run: |
          git config user.name "ARSO Screenshot Bot"
          git config user.email "actions@github.com"
          git add screenshots/
          git commit -m "ARSO screenshot $(date -u +'%Y-%m-%d')" || exit 0
          git push
