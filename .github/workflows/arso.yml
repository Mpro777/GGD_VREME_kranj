name: ARSO Kranj screenshot in Excel

on:
  schedule:
    # 22:55 UTC je pozimi 23:55 v Sloveniji.
    # Poleti bo zagon ob 00:55 po slovenskem času.
    - cron: "55 22 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  zajem:
    runs-on: ubuntu-latest

    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4

      - name: Namesti Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Namesti Playwright in Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Naredi screenshot
        run: python arso_screenshot.py

      - name: Preberi ARSO tabelo in posodobi Excel
        run: python arso_kranj.py

      - name: Shrani rezultate v repozitorij
        run: |
          git config user.name "ARSO Kranj Bot"
          git config user.email "actions@github.com"

          git add screenshots/
          git add ARSO_Kranj.xlsx
          git add arso_kranj.sqlite
          git add arso_kranj.log

          if git diff --cached --quiet; then
            echo "Ni novih sprememb."
            exit 0
          fi

          git commit -m "ARSO Kranj zajem $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
